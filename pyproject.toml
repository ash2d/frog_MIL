[project]
name = "frog-mil"
version = "0.1.0"
description = "Multiple-instance learning for hourly frog call detection from frozen Perch v2 embeddings"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "torch>=2.4",
    "scikit-learn>=1.4",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "matplotlib>=3.8",
]

[project.scripts]
frog          = "frog_mil.pipeline:main"
frog-manifest = "frog_mil.manifest:main"
frog-train    = "frog_mil.train:main"
frog-report   = "frog_mil.report:main"

# Perch v2 needs TensorFlow ~2.20, which we keep out of the training venv on
# purpose: TF and torch each vendor their own CUDA stack and fight over it.
# Embedding is a one-off batch job, so it gets its own environment:
#     UV_PROJECT_ENVIRONMENT=.venv-perch uv sync --only-group perch
#     scripts/perch_env.sh python scripts/embed_perch.py      # or: frog run embed
[dependency-groups]
perch = [
    "tensorflow[and-cuda]~=2.20",
    "perch-hoplite",
    "numpy>=1.26",
    "soundfile>=0.12",
    "scipy>=1.11",
    "tqdm>=4.66",
]
dev = ["ruff>=0.6", "pytest>=8.0"]

[tool.uv.sources]
perch-hoplite = { git = "https://github.com/google-research/perch-hoplite.git" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/frog_mil"]

[tool.ruff]
line-length = 95
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
